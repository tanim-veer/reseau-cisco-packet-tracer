<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1533"/><stop offset="1" stop-color="#1c3a9e"/>
    </linearGradient>
  </defs>
  <rect width="760" height="360" fill="url(#bg)"/>

  <!-- Liaisons série entre routeurs (RIP) -->
  <line x1="275" y1="175" x2="480" y2="95" stroke="#ff8a8a" stroke-width="4"/>
  <line x1="275" y1="175" x2="480" y2="265" stroke="#ff8a8a" stroke-width="4"/>
  <line x1="480" y1="95" x2="480" y2="265" stroke="#ff8a8a" stroke-width="4"/>
  <text x="366" y="104" text-anchor="middle" fill="#ffc2c2" font-size="17" transform="rotate(-21 366 104)">10.1.1.0/24</text>
  <text x="358" y="258" text-anchor="middle" fill="#ffc2c2" font-size="17" transform="rotate(24 358 258)">10.1.2.0/24</text>
  <text x="492" y="186" fill="#ffc2c2" font-size="17">10.1.3.0/24</text>

  <!-- Liaisons routeur ↔ LAN -->
  <line x1="204" y1="175" x2="245" y2="175" stroke="#7da2ff" stroke-width="4"/>
  <line x1="510" y1="95" x2="556" y2="95" stroke="#7da2ff" stroke-width="4"/>
  <line x1="510" y1="265" x2="556" y2="265" stroke="#7da2ff" stroke-width="4"/>

  <!-- Routeurs -->
  <circle cx="275" cy="175" r="30" fill="#2a4396" stroke="#7da2ff" stroke-width="3"/>
  <text x="275" y="182" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">R0</text>
  <circle cx="480" cy="95" r="30" fill="#2a4396" stroke="#7da2ff" stroke-width="3"/>
  <text x="480" y="102" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">R4</text>
  <circle cx="480" cy="265" r="30" fill="#2a4396" stroke="#7da2ff" stroke-width="3"/>
  <text x="480" y="272" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">R5</text>

  <!-- Sous-réseaux utilisateurs -->
  <rect x="24" y="92" width="180" height="166" rx="14" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".3"/>
  <text x="114" y="126" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">LAN 0</text>
  <text x="114" y="156" text-anchor="middle" fill="#a9c0ff" font-size="18">10.1.0.0/24</text>
  <text x="114" y="190" text-anchor="middle" fill="#fff" font-size="18">DNS + web</text>
  <text x="114" y="220" text-anchor="middle" fill="#fff" font-size="18">DHCP · 6 PC</text>

  <rect x="556" y="30" width="180" height="130" rx="14" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".3"/>
  <text x="646" y="66" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">LAN 4</text>
  <text x="646" y="96" text-anchor="middle" fill="#a9c0ff" font-size="18">10.1.4.0/24</text>
  <text x="646" y="130" text-anchor="middle" fill="#fff" font-size="18">DHCP · 7 PC</text>

  <rect x="556" y="200" width="180" height="130" rx="14" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".3"/>
  <text x="646" y="236" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">LAN 5</text>
  <text x="646" y="266" text-anchor="middle" fill="#a9c0ff" font-size="18">10.1.5.0/24</text>
  <text x="646" y="300" text-anchor="middle" fill="#fff" font-size="18">DHCP · 3 PC</text>

  <text x="24" y="318" fill="#cfdaff" font-size="18" font-weight="600">RIP · DHCP redondant</text>
  <text x="24" y="342" fill="#a9c0ff" font-size="16">3 serveurs + relais DHCP</text>
</svg>
